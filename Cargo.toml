[package]
name = "illapa-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "API de Illapa Labs: avisos del SENAMHI por distrito, con su población, listos para la web"
repository = "https://github.com/Illapa-Labs/illapa-engine"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
